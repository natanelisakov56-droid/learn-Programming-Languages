    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-top: 32px; }

    .card small { display: block; margin-top: 8px; font-size: 14px; font-weight: normal; color: #777; }
    .soon { opacity: 0.55; pointer-events: none; }
  </style>
</head>
