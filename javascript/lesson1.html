<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript - שיעור 1</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 140px; font-family: monospace; font-size: 16px; direction: ltr; box-sizing: border-box; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 8px; }
    pre { background: #f4f4f4; padding: 12px; direction: ltr; min-height: 40px; }
    .exercise { background: #eef4ff; padding: 12px 16px; border-radius: 8px; }
  </style>
</head>
<body>
  <p><a href="../index.html">← חזרה לדף הבית</a></p>
  <h1>JavaScript - שיעור 1: ההדפסה הראשונה שלך</h1>
  <p>הפקודה <code>console.log()</code> מציגה טקסט על המסך. שנה את הטקסט שבתוך המרכאות ולחץ "הרץ".</p>

  <textarea id="code">console.log("שלום עולם!");</textarea><br>
  <button id="run">הרץ</button>
  <h3>פלט:</h3>
  <pre id="output"></pre>

  <div class="exercise">
    <strong>תרגיל:</strong> הדפס את השם שלך, ובשורה נפרדת את הגיל שלך.
  </div>

  <script>
    document.getElementById("run").onclick = () => {
      const logs = [];
      const fakeConsole = { log: (...args) => logs.push(args.map(String).join(" ")) };
      try {
        new Function("console", document.getElementById("code").value)(fakeConsole);
      } catch (e) {
        logs.push("שגיאה: " + e.message);
      }
      document.getElementById("output").textContent = logs.join("\n");
    };
  </script>
</body>
</html>
